name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Python tests
        run: python -B -m unittest discover -s tests -p "test*.py" -v

      - name: Extension tests
        run: node --test tests/test_background.js tests/test_captcha_image.js tests/test_detect_helpers.js tests/test_feedback_helpers.js tests/test_popup_startup.js

      - name: Syntax and service checks
        run: |
          node --check extension/popup.js
          python -B ocr_server.py --check
