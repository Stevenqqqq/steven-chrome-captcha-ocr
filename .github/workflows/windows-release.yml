name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          architecture: x64

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Python dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-build.txt

      - name: Test and build release ZIP
        shell: pwsh
        run: |
          $params = @{ PythonExecutable = "python" }
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $params.Version = $env:GITHUB_REF_NAME.Substring(1)
          }
          ./scripts/build_windows_release.ps1 @params

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: StevenCaptchaOCR-Windows-x64
          path: |
            dist/release/*.zip
            dist/release/*.sha256.txt
          if-no-files-found: error

      - name: Attach files to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -LiteralPath dist/release -File | ForEach-Object { $_.FullName }
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME @assets --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME @assets --generate-notes --title $env:GITHUB_REF_NAME
          }
